services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nexus_one
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: usuario1$
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: nexus-one-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.28
    container_name: nexus-one-nginx
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:

